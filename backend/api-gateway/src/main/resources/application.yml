server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # User Service Routes (Authentication)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/logout,/api/auth/refresh,/api/auth/validate,/api/auth/me,/api/users/**
          filters:
            - CircuitBreaker=fallbackUserService
        
        # Patient Service Routes
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**,/api/patient/**,/api/clinicians/**,/api/staff-members/**
          filters:
            - JwtAuthenticationFilter
            - CircuitBreaker=fallbackPatientService
        
        # Vitals Service Routes
        - id: vitals-service
          uri: lb://vitals-service
          predicates:
            - Path=/api/vitals/**,/api/vital/**
          filters:
            - JwtAuthenticationFilter
            - CircuitBreaker=fallbackVitalsService
        
        # AI Prediction Service Routes
        - id: ai-prediction-service
          uri: lb://ai-prediction
          predicates:
            - Path=/api/predictions/**,/api/prediction/**
          filters:
            - JwtAuthenticationFilter
            - CircuitBreaker=fallbackAIPredictionService
        
        # Alert Service Routes
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alerts/**,/api/alert/**,/api/alert-service/**
          filters:
            - JwtAuthenticationFilter
            - CircuitBreaker=fallbackAlertService
        
        # Notification Service Routes
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**,/api/notification/**
          filters:
            - JwtAuthenticationFilter
            - CircuitBreaker=fallbackNotificationService
        
        # Report Service Routes
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**,/api/report/**
          filters:
            - JwtAuthenticationFilter
            - CircuitBreaker=fallbackReportService
      
      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  # Redis Configuration for Rate Limiting
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

meditrack:
  security:
    auth:
      enabled: true
    jwt:
      secret: ${JWT_SECRET:meditrack-ai-gateway-signing-key-2026-local-development}
      expiration-ms: 86400000
    service-jwt:
      secret: ${SERVICE_JWT_SECRET:meditrack-ai-service-signing-key-2026-local-development}
      expiration-ms: 3600000
  services:
    patient-base-url: http://localhost:8082
    user-base-url: http://localhost:8081

# Eureka Client Configuration
eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://admin:admin123@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      fallbackUserService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
      fallbackPatientService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 50
      fallbackVitalsService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
      fallbackAIPredictionService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 50
      fallbackAlertService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
      fallbackNotificationService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 50
      fallbackReportService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 50

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    com.meditrack: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} logger=%logger{36} thread=%thread msg=%msg%n"
    file: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} logger=%logger{36} thread=%thread msg=%msg%n"
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 14
