server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/meditrack_user_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: meditrack_user
    password: meditrack_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Eureka Client Configuration
eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Logging Configuration
logging:
  level:
    com.meditrack: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

meditrack:
  security:
    jwt:
      secret: ${JWT_SECRET:meditrack-ai-gateway-signing-key-2026-local-development}
      expiration-ms: 86400000
